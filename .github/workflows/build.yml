name: Build and Push caddy-l4

on:
  # 1. Запуск при изменениях в ветке main
  push:
    branches:
      - main
  # 2. Автоматический запуск каждый понедельник в 03:00 UTC
  schedule:
    - cron: '0 3 * * 1'
  # 3. Возможность запустить сборку вручную кнопкой в интерфейсе GitHub
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Convert repository name to lowercase
        id: repo
        run: echo "name=${GITHUB_REPOSITORY,,}" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          # Всегда скачивать свежий базовый образ caddy:2-builder и caddy:2-alpine
          pull: true
          # Отключаем кэш слоев, чтобы xcaddy всегда подтягивал свежий коммит caddy-l4
          no-cache: true
          tags: ghcr.io/${{ steps.repo.outputs.name }}:latest